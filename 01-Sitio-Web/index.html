<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <title>Girlys · Manicura y pedicura en Santa Cruz de la Sierra</title>
    <meta
      name="description"
      content="Calcula el precio de tu manicura o pedicura, elige forma, largo y diseño, y reserva en nuestros tres salones de Santa Cruz de la Sierra."
    />
    <link rel="canonical" href="%VITE_SITE_ORIGIN%/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#fdf8f4" />
    <meta name="author" content="Girlys" />

    <!--
      PUNTO 6 · Google Search Console.
      Cuando Google te dé la etiqueta de verificación, descomenta esta línea
      y pega tu código. Después hay que reconstruir (npm run build).
      <meta name="google-site-verification" content="PEGA-AQUI-TU-CODIGO" />
    -->

    <!-- Open Graph: cómo se ve al compartir en WhatsApp, Facebook e Instagram -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Girlys" />
    <meta property="og:locale" content="es_BO" />
    <meta property="og:title" content="Girlys · Manicura y pedicura con precio cerrado" />
    <meta
      property="og:description"
      content="Elige forma, largo y diseño, mira el precio al instante y reserva en nuestros tres salones de Santa Cruz."
    />
    <meta property="og:url" content="%VITE_SITE_ORIGIN%/" />
    <meta property="og:image" content="%VITE_SITE_ORIGIN%/og-girlys.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Girlys, manicura y pedicura en Santa Cruz de la Sierra" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Girlys · Manicura y pedicura con precio cerrado" />
    <meta
      name="twitter:description"
      content="Calcula tu precio, elige forma y diseño, y reserva en Santa Cruz de la Sierra."
    />
    <meta name="twitter:image" content="%VITE_SITE_ORIGIN%/og-girlys.jpg" />

    <!--
      Las fuentes van autoalojadas en public/fuentes (ver app.css).
      A propósito NO hay <link> a fonts.googleapis.com: una petición externa
      cuelga la página si la conexión falla, y el sitio debe abrirse
      aunque no haya wifi.
    -->
    <link
      rel="preload"
      href="./fuentes/karla-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./fuentes/karla-latin-ext.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!--
      Los datos estructurados (NailSalon + FAQPage) los inyecta
      vite.config.js a partir de src/data.js. No se escriben a mano:
      así el teléfono, la dirección y las preguntas nunca se desincronizan.
    -->
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width: 640px; margin: 64px auto; padding: 0 24px; font-family: Georgia, serif; color: #241c17">
        <h1>Girlys · manicura y pedicura</h1>
        <p>
          La calculadora de precios necesita JavaScript. Escríbenos por WhatsApp al
          <a href="https://wa.me/59160475900" style="color: #744644">+591 604 759 00</a>
          y te pasamos el precio y la disponibilidad.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
